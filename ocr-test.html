<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press&milk OCR診断</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f3ef;margin:0;color:#171717}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #222;background:#111;color:#fff;font-weight:700}input{width:100%;padding:12px}.status{white-space:pre-wrap;word-break:break-word;border-radius:10px;padding:12px;background:#fff4df;margin-top:10px;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}</style>
</head>
<body><div class="wrap">
<h2>Press&milk OCR診断</h2>
<div class="card">
<p>レシート写真を1枚だけ選んでください。</p>
<input id="file" type="file" accept="image/*">
<button id="defaultBtn">① 通常方式でOCRテスト</button>
<button id="pinnedBtn">② 固定CDN方式でOCRテスト</button>
<div id="status" class="status">待機中</div>
<pre id="out"></pre>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script>
const f=document.getElementById('file'), st=document.getElementById('status'), out=document.getElementById('out');
function log(m){ if(m && m.status) st.textContent='進行状況: '+m.status+(m.progress!=null?' '+Math.round(m.progress*100)+'%':''); }
async function run(mode){
  out.textContent='';
  const file=f.files[0];
  if(!file){st.textContent='写真を1枚選んでください';return;}
  st.textContent='Tesseract: '+(window.Tesseract?'読込OK':'読込失敗')+'\n方式: '+mode+'\n開始中…';
  let worker;
  try{
    if(mode==='通常'){
      worker=await Tesseract.createWorker('jpn',1,{logger:log});
    }else{
      worker=await Tesseract.createWorker('jpn',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@v5.0.0',cacheMethod:'none',logger:log});
    }
    st.textContent='画像認識中…';
    const r=await worker.recognize(file);
    st.textContent='成功';
    out.textContent=(r.data.text||'').slice(0,2000);
    await worker.terminate();
  }catch(e){
    console.error(e);
    st.textContent='失敗\n'+(e && (e.stack||e.message||String(e)) ? (e.stack||e.message||String(e)) : '不明なエラー');
    try{if(worker) await worker.terminate();}catch(_){}
  }
}
document.getElementById('defaultBtn').onclick=()=>run('通常');
document.getElementById('pinnedBtn').onclick=()=>run('固定CDN');
</script></body></html>
